# ============================================================
# 美月商城 API（meiyue-boot）I1 配置
# ============================================================

spring:
  application:
    name: meiyue-boot

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/meiyue_mall
    username: meiyue
    password: meiyue
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

# JWT（生产务必用环境变量覆盖 secret）
meiyue:
  security:
    jwt:
      # 至少 32 字节；可用环境变量 MEIYUE_SECURITY_JWT_SECRET 覆盖（需额外绑定，此处先写死开发密钥）
      secret: "meiyue-mall-dev-jwt-secret-change-me-32b!"
      issuer: meiyue-mall
      expire-seconds: 86400

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: 美月商城
    code: meiyue-mall
    module: boot
    description: B2B2C 多租户电商 API（I1）

logging:
  level:
    root: INFO
    com.meiyuemall: INFO

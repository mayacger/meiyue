# ============================================================
# 美月商城 API（meiyue-boot）I1 配置
# ============================================================

spring:
  application:
    name: meiyue-boot

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/meiyue_mall
    username: meiyue
    password: meiyue
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

# JWT（生产务必用环境变量覆盖 secret）
meiyue:
  security:
    jwt:
      # 至少 32 字节；生产用环境变量覆盖
      secret: "meiyue-mall-dev-jwt-secret-change-me-32b!"
      issuer: meiyue-mall
      expire-seconds: 86400
  # 支付（I4）：密钥仅配置/环境变量，禁止入库明文
  payment:
    # 本地默认 MOCK；生产改为 WECHAT 或 ALIPAY
    default-channel: MOCK
    mock-enabled: true
    wechat:
      app-id: ${MEIYUE_WECHAT_APP_ID:}
      mch-id: ${MEIYUE_WECHAT_MCH_ID:}
      api-v3-key: ${MEIYUE_WECHAT_API_V3_KEY:}
      private-key-pem: ${MEIYUE_WECHAT_PRIVATE_KEY_PEM:}
      notify-url: ${MEIYUE_WECHAT_NOTIFY_URL:http://localhost:8080/api/v1/payments/notify/wechat}
    alipay:
      app-id: ${MEIYUE_ALIPAY_APP_ID:}
      private-key: ${MEIYUE_ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${MEIYUE_ALIPAY_PUBLIC_KEY:}
      notify-url: ${MEIYUE_ALIPAY_NOTIFY_URL:http://localhost:8080/api/v1/payments/notify/alipay}
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: 美月商城
    code: meiyue-mall
    module: boot
    description: B2B2C 多租户电商 API（I1）

logging:
  level:
    root: INFO
    com.meiyuemall: INFO

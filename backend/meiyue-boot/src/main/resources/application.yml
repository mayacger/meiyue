# ============================================================
# 美月商城 API（meiyue-boot）I1 配置
# ============================================================

spring:
  application:
    name: meiyue-boot

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/meiyue_mall
    username: meiyue
    password: meiyue
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

management:
  endpoints:
    web:
      exposure:
        # I7：健康 + 指标（prometheus 抓取）；敏感端点默认不暴露
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: 美月商城
    code: meiyue-mall
    module: boot
    description: B2B2C 多租户电商 API（I1–I13）

# JWT（生产务必用环境变量覆盖 secret）
meiyue:
  # I13：演示种子开关（默认关；profile=demo 时由 application-demo.yml 打开）
  demo:
    enabled: false
  # I11：站内通知事件自动投递开关
  notify:
    events-enabled: true
  # I10：店券与平台券叠加规则（默认互斥；STACKABLE 预留未启用）
  coupon:
    stacking: MUTUAL_EXCLUSIVE
  security:
    jwt:
      # 至少 32 字节；生产用环境变量覆盖
      secret: "meiyue-mall-dev-jwt-secret-change-me-32b!"
      issuer: meiyue-mall
      expire-seconds: 86400
  # I7/I9：关键接口限流（优先 Redis）
  rate-limit:
    enabled: true
    login-per-minute: 30
    notify-per-minute: 60
    api-per-minute: 300
  # I9：Redis 能力开关
  redis:
    delay-queue-enabled: true
    rate-limit-enabled: true
    ai-queue-enabled: true
  # I9：定时任务；db-fallback 为 true 时仍扫库兜底
  jobs:
    db-fallback-enabled: true
    order-expire-delay-ms: 15000
    aftersale-auto-delay-ms: 20000
    ai-queue-delay-ms: 10000
  # I7：审计开关
  audit:
    enabled: true
  # 支付（I4）：密钥仅配置/环境变量，禁止入库明文
  payment:
    # 本地默认 MOCK；生产改为 WECHAT 或 ALIPAY
    default-channel: MOCK
    mock-enabled: true
    wechat:
      app-id: ${MEIYUE_WECHAT_APP_ID:}
      mch-id: ${MEIYUE_WECHAT_MCH_ID:}
      api-v3-key: ${MEIYUE_WECHAT_API_V3_KEY:}
      private-key-pem: ${MEIYUE_WECHAT_PRIVATE_KEY_PEM:}
      notify-url: ${MEIYUE_WECHAT_NOTIFY_URL:http://localhost:8080/api/v1/payments/notify/wechat}
    alipay:
      app-id: ${MEIYUE_ALIPAY_APP_ID:}
      private-key: ${MEIYUE_ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${MEIYUE_ALIPAY_PUBLIC_KEY:}
      notify-url: ${MEIYUE_ALIPAY_NOTIFY_URL:http://localhost:8080/api/v1/payments/notify/alipay}
  # I8：AI 出图/详情；密钥走环境变量；本地默认 MOCK
  ai:
    provider: ${MEIYUE_AI_PROVIDER:MOCK}
    openai:
      api-key: ${MEIYUE_AI_API_KEY:}
      base-url: ${MEIYUE_AI_BASE_URL:https://api.openai.com/v1}
      model: ${MEIYUE_AI_MODEL:gpt-4o-mini}

server:
  port: 8080

logging:
  level:
    root: INFO
    com.meiyuemall: INFO
